[program:sagamenu-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/sagamenu/current/artisan queue:work redis --sleep=3 --tries=3 --backoff=5 --max-time=3600
directory=/var/www/sagamenu/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/sagamenu/shared/storage/logs/worker.log
stopwaitsecs=3600

